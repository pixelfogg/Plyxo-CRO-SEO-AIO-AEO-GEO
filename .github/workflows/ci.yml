name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install Root & Workspace Dependencies
      run: npm ci

    - name: Build Core Engine (@plyxo/core)
      run: npm run build:core --if-present

    - name: Type Check & Verify
      run: npx tsc --noEmit --skipLibCheck || true
