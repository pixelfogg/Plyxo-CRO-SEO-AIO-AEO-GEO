<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Plyxo CRO — AI-powered Conversion, SEO &amp; AIO intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#161318"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cc785c"/>
      <stop offset="1" stop-color="#e0a08a"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200"/>
    <path d="M200 0 V360 M400 0 V360 M600 0 V360 M800 0 V360 M1000 0 V360"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(64,132)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#accent)"/>
    <path d="M28 68 L28 30 L52 30 Q68 30 68 46 Q68 62 52 62 L40 62" fill="none" stroke="#0b0b0d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="70" r="7" fill="#0b0b0d"/>
  </g>

  <!-- wordmark -->
  <text x="196" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#faf9f5">Plyxo <tspan fill="url(#accent)">CRO</tspan></text>
  <text x="198" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#b8b3ad">AI thinking-partner for conversion, SEO &amp; answer-engine optimization</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(198,236)">
      <rect width="168" height="40" rx="20" fill="#1e1b22" stroke="#cc785c" stroke-opacity="0.5"/>
      <text x="84" y="26" text-anchor="middle" fill="#e0a08a">CRO Vision Audits</text>
    </g>
    <g transform="translate(378,236)">
      <rect width="150" height="40" rx="20" fill="#1e1b22" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle" fill="#a5b4fc">SEO Intelligence</text>
    </g>
    <g transform="translate(540,236)">
      <rect width="132" height="40" rx="20" fill="#1e1b22" stroke="#818cf8" stroke-opacity="0.5"/>
      <text x="66" y="26" text-anchor="middle" fill="#a5b4fc">AIO / LLM SEO</text>
    </g>
    <g transform="translate(684,236)">
      <rect width="146" height="40" rx="20" fill="#1e1b22" stroke="#5db872" stroke-opacity="0.5"/>
      <text x="73" y="26" text-anchor="middle" fill="#86e29b">Automations</text>
    </g>
    <g transform="translate(842,236)">
      <rect width="150" height="40" rx="20" fill="#1e1b22" stroke="#5db872" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle" fill="#86e29b">Integrations</text>
    </g>
  </g>

  <!-- right-side accent bars (mini "score" motif) -->
  <g transform="translate(1000,96)">
    <rect x="0"  y="120" width="20" height="48"  rx="5" fill="url(#accent)"/>
    <rect x="34" y="86"  width="20" height="82"  rx="5" fill="url(#indigo)"/>
    <rect x="68" y="52"  width="20" height="116" rx="5" fill="url(#accent)"/>
    <rect x="102" y="20" width="20" height="148" rx="5" fill="url(#indigo)"/>
  </g>
</svg>
