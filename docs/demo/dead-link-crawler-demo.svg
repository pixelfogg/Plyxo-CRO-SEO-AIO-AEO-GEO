<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="crawlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="100%" stop-color="#191816"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes crawlPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes rowScan { 0%, 15% { opacity: 0; transform: translateY(4px); } 25%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes errFlash { 0%, 100% { fill: #e85a5a; } 50% { fill: #ff7b7b; } }

    .line-flow { animation: crawlPulse 2s infinite ease-in-out; }
    .row-1 { animation: rowScan 3.5s infinite; }
    .row-2 { animation: rowScan 3.5s infinite; animation-delay: 0.2s; }
    .row-3 { animation: rowScan 3.5s infinite; animation-delay: 0.4s; }
    .row-4 { animation: rowScan 3.5s infinite; animation-delay: 0.6s; }
    .err-badge { animation: errFlash 1.5s infinite; }
  </style>

  <!-- Background -->
  <rect width="1000" height="580" rx="14" fill="url(#crawlBg)" stroke="#2e2b27" stroke-width="1.5"/>

  <!-- Chrome Bar -->
  <rect x="0" y="0" width="1000" height="44" rx="14" fill="#1b1a17"/>
  <rect x="0" y="32" width="1000" height="12" fill="#1b1a17"/>
  <circle cx="24" cy="22" r="6" fill="#e85a5a"/><circle cx="44" cy="22" r="6" fill="#e8a55a"/><circle cx="64" cy="22" r="6" fill="#5db872"/>
  <rect x="110" y="10" width="600" height="24" rx="6" fill="#141413" stroke="#2e2b27"/>
  <text x="124" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">/dashboard/link-checker/crawl?depth=4&amp;threads=16</text>

  <!-- Top Hero Header -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="920" height="74" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    <text x="24" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#faf9f5">
      High-Speed Dead Link Scanner &amp; SSRF-Protected DOM Crawler
    </text>
    <text x="24" y="52" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8e8b82">
      Scanned: <tspan fill="#faf9f5" font-weight="700">1,482 URLs</tspan> in 3.8s · Crawl Speed: <tspan fill="#5db872" font-weight="700">390 req/sec</tspan> · SSRF Guard: <tspan fill="#5db872" font-weight="700">ACTIVE</tspan>
    </text>
    <g transform="translate(740, 16)">
      <rect x="0" y="0" width="156" height="42" rx="6" fill="#e85a5a" opacity="0.2"/>
      <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" class="err-badge">⚠️ 2 DEAD LINKS</text>
    </g>
  </g>

  <!-- Scanned URL Rows Table -->
  <g transform="translate(40, 160)">
    <rect x="0" y="0" width="920" height="380" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="920" height="40" rx="10" fill="#1f1e1b"/>
    <rect x="0" y="30" width="920" height="10" fill="#1f1e1b"/>
    <text x="24" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8e8b82">HTTP STATUS</text>
    <text x="160" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8e8b82">CRAWLED URL PATH</text>
    <text x="560" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8e8b82">RESPONSE TIME</text>
    <text x="720" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8e8b82">ACTION RECOMMENDED</text>

    <!-- Row 1 (200 OK) -->
    <g class="row-1" transform="translate(0, 48)">
      <rect x="20" y="0" width="880" height="54" rx="6" fill="#252320" stroke="#2e2b27"/>
      <rect x="36" y="15" width="86" height="24" rx="4" fill="#5db872" opacity="0.2"/>
      <text x="50" y="31" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#5db872">200 OK</text>
      <text x="160" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#faf9f5">/pricing/enterprise-tier</text>
      <text x="560" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">42ms</text>
      <text x="720" y="32" font-family="'Segoe UI', sans-serif" font-size="12" fill="#5db872">✓ Healthy Canonical</text>
    </g>

    <!-- Row 2 (404 Broken) -->
    <g class="row-2" transform="translate(0, 110)">
      <rect x="20" y="0" width="880" height="54" rx="6" fill="#252320" stroke="#e85a5a" stroke-width="1.5"/>
      <rect x="36" y="15" width="86" height="24" rx="4" fill="#e85a5a" opacity="0.25"/>
      <text x="44" y="31" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e85a5a">404 DEAD</text>
      <text x="160" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e85a5a">/blog/2024-cro-framework</text>
      <text x="560" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">18ms</text>
      <text x="720" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cc785c">⚡ 301 Redirect to /blog/cro</text>
    </g>

    <!-- Row 3 (301 Permanent Redirect) -->
    <g class="row-3" transform="translate(0, 172)">
      <rect x="20" y="0" width="880" height="54" rx="6" fill="#252320" stroke="#2e2b27"/>
      <rect x="36" y="15" width="86" height="24" rx="4" fill="#cc785c" opacity="0.2"/>
      <text x="46" y="31" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#cc785c">301 MOVED</text>
      <text x="160" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#faf9f5">/docs/quickstart-guide</text>
      <text x="560" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">34ms</text>
      <text x="720" y="32" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8e8b82">Update Internal Link Path</text>
    </g>

    <!-- Row 4 (404 Broken External) -->
    <g class="row-4" transform="translate(0, 234)">
      <rect x="20" y="0" width="880" height="54" rx="6" fill="#252320" stroke="#e85a5a" stroke-width="1.5"/>
      <rect x="36" y="15" width="86" height="24" rx="4" fill="#e85a5a" opacity="0.25"/>
      <text x="44" y="31" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e85a5a">404 DEAD</text>
      <text x="160" y="32" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#e85a5a">/integrations/old-api-v1</text>
      <text x="560" y="32" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">12ms</text>
      <text x="720" y="32" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#cc785c">⚡ Point to /docs/api</text>
    </g>

    <!-- Bottom summary bar -->
    <g transform="translate(20, 304)">
      <rect x="0" y="0" width="880" height="54" rx="6" fill="#141413" stroke="#2e2b27"/>
      <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="13" fill="#faf9f5">
        🛡️ <tspan font-weight="700">SSRF Filter:</tspan> 0 Private subnet leaks · All links verified clean.
      </text>
      <rect x="680" y="10" width="180" height="34" rx="6" fill="#cc785c"/>
      <text x="702" y="31" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">
        Fix All 2 Broken Links &#8594;
      </text>
    </g>
  </g>
</svg>
