      <text x="44" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">ChatGPT: 94% · Perplexity: 89% · Gemini: 96%</text>
      <text x="44" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cc785c">⭐ High Fact &amp; Entity Density</text>
    </g>

    <!-- Agent 4 -->
    <g transform="translate(16, 318)">
      <rect x="0" y="0" width="428" height="80" rx="8" fill="#252320" stroke="#2e2b27"/>
      <circle cx="24" cy="40" r="10" fill="#5b8cce" opacity="0.2" class="status-check"/>
      <path d="M19 40 L23 44 L30 35" stroke="#5b8cce" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="44" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#faf9f5">4. Keyword Gap &amp; E-E-A-T Cadence</text>
      <text x="44" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">14 Search Intent Clusters Extracted</text>
      <text x="44" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5b8cce">✓ Zero Keyword Cannibalization</text>
    </g>
  </g>

  <!-- Right Column: Code Remediation (Aligned and Contained) -->
  <g transform="translate(512, 164)">
    <rect x="0" y="0" width="452" height="424" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    <text x="20" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8e8b82" letter-spacing="1">
      INSTANT AI CODE REMEDIATION
    </text>

    <!-- Metrics Row -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="132" height="48" rx="6" fill="#252320" stroke="#2e2b27"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8e8b82">REVENUE LIFT</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#5db872">+$14,200/mo</text>

      <rect x="144" y="0" width="132" height="48" rx="6" fill="#252320" stroke="#2e2b27"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8e8b82" transform="translate(144, 0)">ISSUES FOUND</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#e8a55a" transform="translate(144, 0)">3 High · 0 Crit</text>

      <rect x="288" y="0" width="132" height="48" rx="6" fill="#252320" stroke="#2e2b27"/>
      <text x="12" y="20" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8e8b82" transform="translate(288, 0)">CRAWL DEPTH</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#5b8cce" transform="translate(288, 0)">100% Verified</text>
    </g>

    <!-- Code Box -->
    <g transform="translate(16, 104)">
      <rect x="0" y="0" width="420" height="304" rx="8" fill="#141413" stroke="#cc785c" stroke-width="1" class="code-card"/>
      <rect x="0" y="0" width="420" height="30" rx="8" fill="#1f1e1b"/>
      <rect x="0" y="22" width="420" height="8" fill="#1f1e1b"/>
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cc785c">⚡ schema-faq-remediation.tsx</text>

      <!-- Code Lines -->
      <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">1  <tspan fill="#cc785c">export function</tspan> <tspan fill="#faf9f5">FaqSchemaMarkup() {</tspan></text>
      <text x="14" y="74" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">2    <tspan fill="#cc785c">const</tspan> jsonLd = {</text>
      <text x="14" y="96" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">3      <tspan fill="#5db872">"@context"</tspan>: <tspan fill="#e8a55a">"https://schema.org"</tspan>,</text>
      <text x="14" y="118" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">4      <tspan fill="#5db872">"@type"</tspan>: <tspan fill="#e8a55a">"FAQPage"</tspan>,</text>
      <text x="14" y="140" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">5      <tspan fill="#5db872">"mainEntity"</tspan>: [{</text>
      <text x="14" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">6        <tspan fill="#5db872">"@type"</tspan>: <tspan fill="#e8a55a">"Question"</tspan>,</text>
      <text x="14" y="184" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">7        <tspan fill="#5db872">"name"</tspan>: <tspan fill="#e8a55a">"What is the expected lift?"</tspan>,</text>
      <text x="14" y="206" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">8        <tspan fill="#5db872">"acceptedAnswer"</tspan>: {</text>
      <text x="14" y="228" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">9          <tspan fill="#5db872">"text"</tspan>: <tspan fill="#e8a55a">"+24% conversion throughput"</tspan></text>
      <text x="14" y="250" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">10       }</text>
      <text x="14" y="272" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">11     }]</text>
      <text x="14" y="294" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">12   };</text>
    </g>
  </g>
</svg>
