<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="50%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc785c"/>
      <stop offset="100%" stop-color="#e8a55a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.1); } }
    @keyframes progressBar { 0% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }
    @keyframes checkGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; filter: drop-shadow(0 0 4px #5db872); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes codeBorder { 0%, 100% { stroke: #38342f; } 50% { stroke: #cc785c; } }

    .pulse-dot { animation: pulse 2s infinite ease-in-out; transform-origin: 880px 24px; }
    .scan-line { transform-origin: left; animation: progressBar 4s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .status-check { animation: checkGlow 2.5s infinite ease-in-out; }
    .cursor { animation: blink 1s infinite; }
    .code-card { animation: codeBorder 3s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="620" rx="14" fill="url(#bgGrad)" stroke="#2e2b27" stroke-width="1.5"/>

  <!-- Browser Chrome -->
  <rect x="0" y="0" width="1000" height="48" rx="14" fill="#1b1a17"/>
  <rect x="0" y="36" width="1000" height="12" fill="#1b1a17"/>
  <line x1="0" y1="48" x2="1000" y2="48" stroke="#2e2b27" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="24" r="6" fill="#e85a5a"/>
  <circle cx="44" cy="24" r="6" fill="#e8a55a"/>
  <circle cx="64" cy="24" r="6" fill="#5db872"/>

  <!-- Command URL Bar -->
  <rect x="110" y="12" width="660" height="24" rx="6" fill="#141413" stroke="#2e2b27"/>
  <text x="124" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">
    <tspan fill="#cc785c">⚡ plyxo audit</tspan> --url=https://growth-brand.com <tspan fill="#5db872">--engine=claude-seo</tspan>
  </text>
  <rect x="520" y="17" width="2" height="14" fill="#cc785c" class="cursor"/>

  <!-- Live Status Badge -->
  <g class="pulse-dot">
    <circle cx="880" cy="24" r="5" fill="#5db872" filter="url(#glow)"/>
  </g>
  <text x="892" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#5db872" letter-spacing="1">LIVE AUDIT</text>

  <!-- Progress Bar Top Line -->
  <rect x="0" y="48" width="1000" height="3" fill="#252320"/>
  <rect x="0" y="48" width="1000" height="3" fill="url(#brandGrad)" class="scan-line"/>

  <!-- Top Hero Info Section -->
  <g transform="translate(36, 68)">
    <rect x="0" y="0" width="928" height="80" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    
    <text x="24" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#faf9f5">
      Claude-SEO Autonomous Intelligence Engine
    </text>
    <text x="24" y="56" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#8e8b82">
      Target: <tspan fill="#faf9f5" font-weight="600">https://growth-brand.com</tspan> · Multi-Tier WAF Bypass · 6 Specialist Agents Active
    </text>

    <!-- Health Score Pill -->
    <rect x="752" y="14" width="156" height="52" rx="8" fill="#252320" stroke="#38342f"/>
    <text x="768" y="34" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#8e8b82" letter-spacing="0.5">HEALTH SCORE</text>
    <text x="768" y="56" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#5db872">94<tspan font-size="14" font-weight="500" fill="#8e8b82">/100</tspan></text>
  </g>

  <!-- Left Column: Parallel Specialist Agents Stream (All Visible with Live Status) -->
  <g transform="translate(36, 164)">
    <rect x="0" y="0" width="460" height="424" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    <text x="20" y="28" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#8e8b82" letter-spacing="1">
      PARALLEL AGENT EXECUTION
    </text>

    <!-- Agent 1 -->
    <g transform="translate(16, 42)">
