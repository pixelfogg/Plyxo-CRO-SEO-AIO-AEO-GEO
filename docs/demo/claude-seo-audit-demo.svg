      <circle cx="24" cy="40" r="10" fill="#5db872" opacity="0.2" class="status-check"/>
      <path d="M19 40 L23 44 L30 35" stroke="#5db872" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="44" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#faf9f5">1. Technical SEO &amp; WAF Bypass</text>
      <text x="44" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">Cloudflare Bypassed · LCP: 1.1s · CLS: 0.02</text>
      <text x="44" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5db872">✓ 0 Crawl Blockers · HTTP 200 Clean</text>
    </g>

    <!-- Agent 2 -->
    <g transform="translate(16, 134)">
      <rect x="0" y="0" width="428" height="80" rx="8" fill="#252320" stroke="#2e2b27"/>
      <circle cx="24" cy="40" r="10" fill="#5db872" opacity="0.2" class="status-check"/>
      <path d="M19 40 L23 44 L30 35" stroke="#5db872" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="44" y="30" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#faf9f5">2. Schema.org &amp; JSON-LD Audit</text>
      <text x="44" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8e8b82">Product, FAQPage, BreadcrumbList</text>
      <text x="44" y="66" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5db872">✓ Rich Snippets Validated</text>
