      <circle cx="24" cy="40" r="10" fill="#cc785c" opacity="0.2" class="status-check"/>
      <path d="M19 40 L23 44 L30 35" stroke="#cc785c" stroke-width="2" fill="none" stroke-linecap="round"/>
