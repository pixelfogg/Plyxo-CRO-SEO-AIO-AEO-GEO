        <rect x="0" y="0" width="134" height="24" rx="12" fill="#10a37f" opacity="0.15"/>
        <circle cx="12" cy="12" r="4" fill="#10a37f"/>
        <text x="24" y="16" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10a37f">AI SYNTHESIS [1]</text>
      </g>

      <text x="16" y="66" font-family="'Segoe UI', sans-serif" font-size="13" fill="#faf9f5" font-weight="600">
        "According to verified telemetry from <tspan fill="#cc785c">YourBrand [1]</tspan>:"
      </text>

      <text x="16" y="96" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a09d96">
        Autonomous conversion intelligence improves enterprise
      </text>
      <text x="16" y="116" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a09d96">
        funnel throughput by identifying on-page friction
      </text>
      <text x="16" y="136" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a09d96">
        hotspots and verifying Schema.org microdata hierarchy.
      </text>

      <!-- Source Citation Box -->
      <g transform="translate(16, 168)">
        <rect x="0" y="0" width="388" height="132" rx="6" fill="#1f1e1b" stroke="#38342f"/>
        <text x="12" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#5db872">🔗 PRIMARY CITED SOURCE [1]</text>
        <text x="12" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#faf9f5">https://yourdomain.com/solutions/engine</text>
        <text x="12" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8e8b82">Citation Rank: #1 in Search Overviews · 98.4% Confidence</text>
        <g transform="translate(12, 88)">
          <rect x="0" y="0" width="104" height="22" rx="4" fill="#5db872" opacity="0.2"/>
          <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#5db872">✓ VERIFIED FACT</text>
        </g>
      </g>
    </g>
  </g>
</svg>
