      <text x="372" y="14" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#8e75f8">96%</text>
      <rect x="0" y="24" width="412" height="12" rx="6" fill="#252320"/>
      <g class="bar-g3">
        <rect x="0" y="24" width="412" height="12" rx="6" fill="url(#geminiGrad)"/>
      </g>
    </g>

    <!-- Anthropic Claude -->
    <g transform="translate(20, 244)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#faf9f5">Anthropic Claude 3.7 Sonnet</text>
      <text x="372" y="14" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#cc785c">91%</text>
      <rect x="0" y="24" width="412" height="12" rx="6" fill="#252320"/>
      <g class="bar-g4">
        <rect x="0" y="24" width="412" height="12" rx="6" fill="url(#claudeGrad)"/>
      </g>
    </g>

    <!-- Entity Signals Badge -->
    <g transform="translate(20, 318)">
      <rect x="0" y="0" width="412" height="46" rx="6" fill="#252320" stroke="#38342f"/>
      <text x="14" y="28" font-family="'Segoe UI', sans-serif" font-size="12" fill="#faf9f5">
        🏷️ <tspan font-weight="700">Entity Signals:</tspan> Schema.org Fact Density ✓ · Direct TL;DR ✓
      </text>
    </g>
