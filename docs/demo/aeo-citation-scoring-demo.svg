  <!-- Right: Simulated LLM Citation Box (Bounded to 460px) -->
  <g transform="translate(508, 160)">
    <rect x="0" y="0" width="456" height="384" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#8e8b82" letter-spacing="1">
