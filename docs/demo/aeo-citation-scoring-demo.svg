<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="aeoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141413"/>
      <stop offset="50%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
    <linearGradient id="chatgptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#55dda8"/>
    </linearGradient>
    <linearGradient id="perplexityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22b8cf"/>
      <stop offset="100%" stop-color="#66d9e8"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8e75f8"/>
      <stop offset="100%" stop-color="#b197fc"/>
    </linearGradient>
    <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc785c"/>
      <stop offset="100%" stop-color="#e8a55a"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes barAnim1 { 0% { transform: scaleX(0.1); } 50%, 100% { transform: scaleX(0.94); } }
    @keyframes barAnim2 { 0% { transform: scaleX(0.1); } 50%, 100% { transform: scaleX(0.89); } }
    @keyframes barAnim3 { 0% { transform: scaleX(0.1); } 50%, 100% { transform: scaleX(0.96); } }
    @keyframes barAnim4 { 0% { transform: scaleX(0.1); } 50%, 100% { transform: scaleX(0.91); } }
    @keyframes pulseTag { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

    .bar-g1 { transform-origin: left; animation: barAnim1 3.5s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .bar-g2 { transform-origin: left; animation: barAnim2 3.5s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .bar-g3 { transform-origin: left; animation: barAnim3 3.5s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .bar-g4 { transform-origin: left; animation: barAnim4 3.5s infinite cubic-bezier(0.16, 1, 0.3, 1); }
    .pill-glow { animation: pulseTag 2s infinite ease-in-out; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="580" rx="14" fill="url(#aeoBg)" stroke="#2e2b27" stroke-width="1.5"/>

  <!-- Window Chrome -->
  <rect x="0" y="0" width="1000" height="44" rx="14" fill="#1b1a17"/>
  <rect x="0" y="32" width="1000" height="12" fill="#1b1a17"/>
  <circle cx="24" cy="22" r="6" fill="#e85a5a"/><circle cx="44" cy="22" r="6" fill="#e8a55a"/><circle cx="64" cy="22" r="6" fill="#5db872"/>
  <rect x="110" y="10" width="660" height="24" rx="6" fill="#141413" stroke="#2e2b27"/>
  <text x="124" y="26" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">/dashboard/aio/benchmark?query=best+b2b+analytics+engine</text>

  <!-- Section Header -->
  <g transform="translate(36, 68)">
    <rect x="0" y="0" width="928" height="74" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    <text x="24" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#faf9f5">
      LLM Citation Probability &amp; Answer Engine Optimization (AEO/GEO)
    </text>
    <text x="24" y="52" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8e8b82">
      Target Query: <tspan fill="#e8a55a" font-family="'JetBrains Mono', monospace">"best b2b conversion optimization engine"</tspan> · Entity Density: <tspan fill="#5db872" font-weight="700">98.4%</tspan>
    </text>
    <rect x="752" y="14" width="156" height="46" rx="6" fill="#252320" stroke="#38342f"/>
    <text x="766" y="32" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#8e8b82">CITABLE AUTHORITY</text>
    <text x="766" y="48" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#5db872">⭐ VERY HIGH</text>
  </g>

  <!-- Left: Engine Citation Probability Progress Bars (Bounded to 440px) -->
  <g transform="translate(36, 160)">
    <rect x="0" y="0" width="452" height="384" rx="10" fill="#1a1917" stroke="#2e2b27"/>
    <text x="20" y="30" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#8e8b82" letter-spacing="1">
      LLM BENCHMARK CITATION RATES
    </text>

    <!-- ChatGPT Search -->
    <g transform="translate(20, 52)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#faf9f5">ChatGPT Search (GPT-4o)</text>
      <text x="372" y="14" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10a37f">94%</text>
      <rect x="0" y="24" width="412" height="12" rx="6" fill="#252320"/>
      <g class="bar-g1">
        <rect x="0" y="24" width="412" height="12" rx="6" fill="url(#chatgptGrad)"/>
      </g>
    </g>

    <!-- Perplexity AI -->
    <g transform="translate(20, 116)">
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#faf9f5">Perplexity AI Pro</text>
      <text x="372" y="14" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#22b8cf">89%</text>
      <rect x="0" y="24" width="412" height="12" rx="6" fill="#252320"/>
      <g class="bar-g2">
        <rect x="0" y="24" width="412" height="12" rx="6" fill="url(#perplexityGrad)"/>
      </g>
    </g>

    <!-- Google Gemini -->
    <g transform="translate(20, 180)">
