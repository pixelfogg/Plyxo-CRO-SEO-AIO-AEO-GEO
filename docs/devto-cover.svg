<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0d0c"/>
      <stop offset="50%" stop-color="#181715"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cc785c"/>
      <stop offset="50%" stop-color="#e8a55a"/>
      <stop offset="100%" stop-color="#f5d08a"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5db872"/>
      <stop offset="100%" stop-color="#8ee09e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="420" fill="url(#coverBg)"/>
  
  <!-- Subtle Grid Texture -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/><line x1="200" y1="0" x2="200" y2="420"/><line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/><line x1="500" y1="0" x2="500" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/><line x1="800" y1="0" x2="800" y2="420"/><line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="0" y1="80" x2="1000" y2="80"/><line x1="0" y1="160" x2="1000" y2="160"/><line x1="0" y1="240" x2="1000" y2="240"/><line x1="0" y1="320" x2="1000" y2="320"/>
  </g>

  <!-- Glowing Radial Backdrop -->
  <circle cx="500" cy="210" r="300" fill="#cc785c" opacity="0.08" filter="blur(60px)"/>

  <!-- Top Pill Badge -->
  <g transform="translate(360, 42)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#252320" stroke="#cc785c" stroke-width="1.5"/>
    <text x="140" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e8a55a" text-anchor="middle" letter-spacing="1">
      ⚡ 100% FREE &amp; OPEN SOURCE
    </text>
  </g>

  <!-- Main Hero Headline -->
  <text x="500" y="148" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">
    PLYXO CRO &amp; CLAUDE-SEO
  </text>

  <!-- Subheadline -->
  <text x="500" y="196" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#faf9f5" text-anchor="middle">
    Autonomous AI Vision Inspections • Technical SEO • LLM Citation Engine
  </text>
  <text x="500" y="226" font-family="'Segoe UI', sans-serif" font-size="14" fill="#a09d96" text-anchor="middle">
    The self-hosted, privacy-first alternative to Ahrefs, Hotjar &amp; Screaming Frog
  </text>

  <!-- 3 Feature Chips Row -->
  <g transform="translate(100, 260)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="250" height="54" rx="10" fill="#1b1a17" stroke="#2e2b27"/>
    <text x="20" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#faf9f5">🎯 Visual Bounding Box AI</text>
    <text x="20" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5db872">Drop-in React/CSS Fixes</text>

    <!-- Chip 2 -->
    <rect x="275" y="0" width="250" height="54" rx="10" fill="#1b1a17" stroke="#2e2b27"/>
    <text x="295" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#faf9f5">🤖 AEO Citation Scorer</text>
    <text x="295" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cc785c">ChatGPT • Claude • Gemini</text>

    <!-- Chip 3 -->
    <rect x="550" y="0" width="250" height="54" rx="10" fill="#1b1a17" stroke="#2e2b27"/>
    <text x="570" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#faf9f5">🛡️ Resilient WAF Bypass</text>
    <text x="570" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="#5b8cce">Zero 403 Audit Blocks</text>
  </g>

  <!-- Bottom Technology Badges -->
  <g transform="translate(500, 370)" text-anchor="middle">
    <text font-family="'JetBrains Mono', monospace" font-size="12" fill="#8e8b82">
      Next.js 16 (Turbopack) · TypeScript · PostgreSQL · Drizzle ORM · Google Gemini 2.0
    </text>
  </g>
</svg>
